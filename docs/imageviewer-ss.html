<!-- This image viewer is for game screenshots - shows them at 2x (256x192 becomes 512x384) -->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
    <title>Screenshot Viewer</title>

    <style type="text/css">
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			background-color: black;
		}

		body {
			display: flex;
			flex-direction: column;		/* Image above, return text below */
			justify-content: center;	/* center vertically */
			align-items: center;		/* center horizontally */
		}

		#viewerImage {
			width: 512px;				/* 2x the 256x192 screenshot */
			height: 384px;
			width: min(512px, 100vw, calc((100vh - 40px) * 4 / 3));	/* Shrinks to fit a small frame (leaving room for the return text), keeping 4:3 */
			height: auto;
			image-rendering: pixelated;	/* Crisp Spectrum pixels, no blur when scaled */
			border: 0;
			margin: 0;
			padding: 0;
			cursor: pointer;			/* Hand cursor on hover */
		}

		.return-hint {
			color: #bbb;				/* Same dimmed grey as site links */
			font-family: Verdana, Arial, sans-serif;
			font-size: 12px;			/* Same size as captions */
			margin-top: 10px;
		}
    </style>

    <script type="text/javascript">
    function loadImage() {
        var hash = window.location.hash;

        if (hash && hash.length > 1) {
            var imgPath = hash.substring(1);

            // Decode %20 etc. (works in old + new browsers)
            try {
                imgPath = decodeURIComponent(imgPath);
            } catch (e) {}

            var img = document.getElementById("viewerImage");
            img.src = imgPath;
        }
    }

    function keyHandler(e) {
        e = e || window.event;
        var key = e.keyCode || e.which;

        // ESC goes back to the previous page
        if (key == 27) {
            history.back();
        }
    }

    window.onload = function() {
        loadImage();

        if (document.addEventListener) {
            document.addEventListener("keydown", keyHandler, false);
        } else if (document.attachEvent) {
            document.attachEvent("onkeydown", keyHandler);
        }
    };
    </script>
</head>

<body>
    <img id="viewerImage" onclick="history.back();">
    <div class="return-hint">Click image to return</div>
</body>
</html>
