<!-- This image viewer is for game screenshots - shows them at 2x their own size (256x192 becomes 512x384) -->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
    <title>Screenshot Viewer</title>

    <style type="text/css">
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			background-color: black;
		}

		body {
			display: flex;
			flex-direction: column;		/* Image above, return text below */
			justify-content: center;	/* center vertically */
			align-items: center;		/* center horizontally */
		}

		#viewerImage {
			/* Width and height are set by sizeImage() below */
			image-rendering: pixelated;	/* Crisp Spectrum pixels, no blur when scaled */
			border: 0;
			margin: 0;
			padding: 0;
			cursor: pointer;			/* Hand cursor on hover */
		}

		.return-hint {
			color: #bbb;				/* Same dimmed grey as site links */
			font-family: Verdana, Arial, sans-serif;
			font-size: 12px;			/* Same size as captions */
			margin-top: 10px;
		}
    </style>

    <script type="text/javascript">
    function loadImage() {
        var hash = window.location.hash;

        if (hash && hash.length > 1) {
            var imgPath = hash.substring(1);

            // Decode %20 etc. (works in old + new browsers)
            try {
                imgPath = decodeURIComponent(imgPath);
            } catch (e) {}

            var img = document.getElementById("viewerImage");
            img.onload = sizeImage;
            img.src = imgPath;
        }
    }

    // Show the image at 2x its own size, shrunk if needed to fit the frame
    // (leaving room for the return text below it). Works for any size of
    // image, not just 256x192, and keeps its shape.
    function sizeImage() {
        var img = document.getElementById("viewerImage");
        if (!img.naturalWidth) return;

        var scale = Math.min(2,
            window.innerWidth / img.naturalWidth,
            (window.innerHeight - 40) / img.naturalHeight);

        img.style.width = Math.floor(img.naturalWidth * scale) + "px";
        img.style.height = Math.floor(img.naturalHeight * scale) + "px";
    }

    function keyHandler(e) {
        e = e || window.event;
        var key = e.keyCode || e.which;

        // ESC goes back to the previous page
        if (key == 27) {
            history.back();
        }
    }

    window.onload = function() {
        loadImage();

        // Re-fit when the frame changes size (e.g. on phones, where the
        // frame is resized to the screen after this page loads)
        window.onresize = sizeImage;

        if (document.addEventListener) {
            document.addEventListener("keydown", keyHandler, false);
        } else if (document.attachEvent) {
            document.attachEvent("onkeydown", keyHandler);
        }
    };
    </script>
</head>

<body>
    <img id="viewerImage" onclick="history.back();">
    <div class="return-hint">Click image to return</div>
</body>
</html>
