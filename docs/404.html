<!DOCTYPE html>
<html lang="en">

<!-- ======================================================================
     404 PAGE
     GitHub Pages shows this file for any address that doesn't exist.
     It runs RAZE with zxsa_files/roms/404.tzx - a tiny BASIC program called
     "404" that auto-runs and prints "R Web loading error, 404":

         10 PRINT #0;"R Web loading error, 404";
         20 GO TO 20

     It's shown AT the broken address (e.g. zxsa.co.uk/some/old/page.html),
     so every path below starts with "/" - relative paths would break.
     ====================================================================== -->

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>R Web loading error, 404</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<style>
    html, body {
        margin: 0;
        height: 100%;
        background: #000;
    }
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: Verdana, Arial, sans-serif;
        font-size: 13px;
        color: #888;
    }
    /* The Spectrum screen: 256x192 plus RAZE's 32-pixel border = 5:4 */
    #spectrum {
        width: min(94vw, 110vh);
        aspect-ratio: 5 / 4;
        border: 0;
        display: block;
        background: #000;
    }
    p {
        margin: 14px 0 0;
    }
    a:link, a:visited {
        color: #bbb;
        font-weight: bold;
        text-decoration: none;
    }
    a:hover {
        color: #fff;
        text-decoration: underline;
    }
</style>
</head>

<body>

<iframe id="spectrum" title="ZX Spectrum loading a tape"
    src="/zxsa_files/emulator/index.html?tape=/zxsa_files/roms/404.tzx&amp;48k=Y&amp;webgl=N&amp;dither=Y&amp;border=32"></iframe>

<p>That page isn't on this tape. <a href="/index.html">Back to the ZX Spectrum Archive</a></p>

<script>
/* Show just the Spectrum's screen - hide RAZE's title, buttons and keyboard */
document.getElementById("spectrum").addEventListener("load", function () {
    try {
        var doc = this.contentDocument;
        var style = doc.createElement("style");
        style.textContent =
            "html, body { margin: 0; background: #000; overflow: hidden; }" +
            "h1, #controls { display: none !important; }" +
            "#stage { width: 100%; border: 0; margin: 0; }" +
            "#canvases { cursor: default; }";
        doc.head.appendChild(style);
    } catch (e) { /* Can't reach inside (shouldn't happen on the same site) - shows the full emulator instead */ }
});
</script>

</body>
</html>
