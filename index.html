<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>ZX Spectrum Archive - 2026 Reboot</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
</head>

<body class="zxsa-layout">

<!-- Mobile warning banner -->
<div id="mobile-warning" style="display:none; padding:10px; background:#333; color:#fff;">
    This site is best viewed on a desktop or laptop. A full mobile version is coming soon.
    <label style="display:block; margin-top:8px;">
        <input type="checkbox" id="hide-warning"> Don’t show this again
    </label>
</div>

<div class="zxsa-wrapper">

    <!-- navigation iframe -->
    <iframe class="zxsa-frame" src="zxsa_frame.html"></iframe>

    <!-- Main content area -->
    <div class="zxsa-main">
        <iframe class="zxsa-top" src="zxsa_frame_top.html"></iframe>
        <iframe class="zxsa-bottom" name="rbottom" src="zxsa_main.html"></iframe>
    </div>

</div>

<script>
(function () {
    const isMobile = /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent);

    // If user previously opted out, do nothing
    if (localStorage.getItem("hideMobileWarning") === "true") return;

    if (isMobile) {
        const box = document.getElementById("mobile-warning");
        const checkbox = document.getElementById("hide-warning");

        box.style.display = "block";

        checkbox.addEventListener("change", function () {
            if (this.checked) {
                localStorage.setItem("hideMobileWarning", "true");
                box.style.display = "none";
            }
        });
    }
})();
</script>

</body>
</html>
